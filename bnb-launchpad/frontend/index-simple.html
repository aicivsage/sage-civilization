<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNB Token Launchpad - Debug</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-4xl font-bold mb-4">🚀 BNB Token Launchpad</h1>

        <div class="bg-gray-800 p-6 rounded-lg mb-4">
            <h2 class="text-2xl mb-2">Debug Info</h2>
            <div id="debugInfo" class="text-sm space-y-1">
                <p>✅ Page loaded successfully</p>
                <p>✅ Tailwind CSS working</p>
                <p id="ethersjsCheck">⏳ Checking ethers.js...</p>
                <p id="metaMaskCheck">⏳ Checking MetaMask...</p>
            </div>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg mb-4">
            <h2 class="text-2xl mb-4">Wallet Connection</h2>
            <button id="connectBtn" class="bg-purple-600 px-6 py-3 rounded-lg font-semibold hover:bg-purple-700">
                Connect MetaMask
            </button>
            <div id="walletInfo" class="mt-4 hidden">
                <p>Connected: <span id="walletAddress" class="font-mono"></span></p>
                <p>Balance: <span id="walletBalance"></span></p>
            </div>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg">
            <h2 class="text-2xl mb-2">Contract Info</h2>
            <p class="text-sm">Factory: <span class="font-mono text-green-400">0x5FD5a0914864B4A28fA7423b8BFAf436F210CEfC</span></p>
            <p class="text-sm">Network: <span class="text-yellow-400">BSC Testnet (Chain ID 97)</span></p>
        </div>
    </div>

    <!-- Load ethers.js -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

    <script>
        console.log('=== Debug Script Starting ===');

        // Check ethers.js loaded
        if (typeof ethers !== 'undefined') {
            document.getElementById('ethersjsCheck').innerHTML = '✅ Ethers.js loaded (v' + ethers.version + ')';
            console.log('✅ Ethers.js loaded:', ethers.version);
        } else {
            document.getElementById('ethersjsCheck').innerHTML = '❌ Ethers.js failed to load';
            console.error('❌ Ethers.js NOT loaded');
        }

        // Check MetaMask
        if (typeof window.ethereum !== 'undefined') {
            document.getElementById('metaMaskCheck').innerHTML = '✅ MetaMask detected';
            console.log('✅ MetaMask detected');
        } else {
            document.getElementById('metaMaskCheck').innerHTML = '❌ MetaMask not found';
            console.warn('❌ MetaMask not detected');
        }

        // Connect button
        document.getElementById('connectBtn').addEventListener('click', async () => {
            console.log('Connect button clicked');

            if (!window.ethereum) {
                alert('Please install MetaMask!');
                return;
            }

            try {
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                const accounts = await provider.send("eth_requestAccounts", []);
                const signer = provider.getSigner();
                const address = await signer.getAddress();
                const balance = await provider.getBalance(address);

                document.getElementById('walletAddress').textContent = address;
                document.getElementById('walletBalance').textContent = ethers.utils.formatEther(balance) + ' BNB';
                document.getElementById('walletInfo').classList.remove('hidden');

                console.log('✅ Connected:', address);
                alert('Connected successfully!');
            } catch (error) {
                console.error('Connection error:', error);
                alert('Connection failed: ' + error.message);
            }
        });

        console.log('=== Debug Script Complete ===');
    </script>
</body>
</html>
