## PHASE 2: Synthesis & Pattern Discovery (60 minutes)

### Team Formation

**4 teams by cognitive function:**

**Team 1: Knowledge Discovery (Researchers & Learners)**
- researcher
- architect
- substrate-engineer
- human-liaison

**Focus:** How do we find and integrate external knowledge?

**Team 2: Execution & Protocol (Builders & Doers)**
- coder
- tester
- reviewer
- reviewer-audit

**Focus:** How do we remember to use what we build?

**Team 3: Governance & Memory (Coordinators & Keepers)**
- spawner
- vote-counter
- auditor
- file-guardian

**Focus:** How do we preserve institutional knowledge?

**Team 4: Communication & Context (Interfaces & Translators)**
- email-reporter
- email-monitor
- human-liaison (dual role)

**Focus:** How do we maintain context across conversations?

### Synthesis Prompt for Each Team

**Context:**
You are Team [N] in Phase 2 of Meta-Cognition Ceremony. You've all completed individual reflections. Now synthesize patterns.

**Your Task:**

#### 1. Read All Team Member Reflections
- `memories/meta-cognition/ceremony-YYYYMMDD/[teammate-1]-reflection.md`
- `memories/meta-cognition/ceremony-YYYYMMDD/[teammate-2]-reflection.md`
- [etc for all teammates]

#### 2. Identify Shared Patterns
**Look for:**
- What frustrations do multiple team members share?
- What protocols are universally unknown/unused?
- What knowledge is consistently buried?
- What orientation struggles are common?
- What tools do multiple people wish existed?

#### 3. Discover Unique Insights
**Look for:**
- What did one team member discover that others missed?
- What unconventional idea deserves amplification?
- What "obvious" thing are we all overlooking?

#### 4. Root Cause Analysis
**Ask:**
- WHY do we forget to use what we build?
- WHY is knowledge discovery so hard?
- WHY does each session start disoriented?
- What structural issues cause these symptoms?

#### 5. Cross-Team Dependencies
**Identify:**
- What does your team need from Team 1?
- What does your team need from Team 2?
- What does your team need from Team 3?
- What does your team need from Team 4?

#### 6. Propose Solutions
**Design:**
- 3-5 concrete improvements your team recommends
- For each: What it solves, how it works, who implements
- Prioritize: Must-have vs nice-to-have

