## Meta-Protocol: Continuous Improvement System

### When to Run Meta-Cognition Ceremonies

**Regular Schedule:**
- Full ceremony: Quarterly (every 3 months)
- Mini ceremony: Monthly (focused on one area)
- Spot check: Weekly (session start checklist review)

**Triggered Ceremonies:**
- After major failures (3+ similar failures in 1 week)
- After capability additions (new agents, tools, protocols)
- When agents report persistent confusion
- When Corey observes we're forgetting things

### Meta-Cognition Checklist (Weekly Spot Check)

**Every Monday (or first session of week):**
- [ ] Did we use the tools we built last week?
- [ ] Did we follow the protocols we documented?
- [ ] Did new agents learn what they needed to know?
- [ ] Did we reference our learnings from last week?
- [ ] What did we forget that we should have remembered?

**If 2+ items checked "no":** Schedule mini ceremony

### Tracking Improvement Effectiveness

**File:** `memories/meta-cognition/improvement-tracker.json`

```json
{
  "ceremony_date": "2025-10-04",
  "solutions_implemented": [
    {
      "solution": "Solution 1 Name",
      "implemented_date": "2025-10-05",
      "owner": "agent-name",
      "success_metric": "metric description",
      "baseline_value": 3.2,
      "target_value": 8.0,
      "current_value": 6.5,
      "status": "improving",
      "notes": "Seeing adoption, needs more time"
    }
  ]
}
```

**Monthly Review:**
- Check all improvement tracker entries
- Measure current values
- Identify what's working vs what's not
- Iterate or abandon failed improvements

### Integration Protocol (How New Learnings Become Habits)

**When we learn something valuable:**

1. **Document:** Write to appropriate playbook/guide
2. **Announce:** Post to message bus (when implemented)
3. **Integrate:** Add to relevant agent manifests
4. **Test:** Verify agents can find and use it
5. **Track:** Add to improvement tracker
6. **Reinforce:** Reference in session start checklist
7. **Verify:** Check usage in weekly spot check

**Example:**
- Learn: "HTML email utility works great"
- Document: Update email-ops-playbook.md
- Announce: "New HTML email utility available"
- Integrate: Add to email-reporter and human-liaison manifests
- Test: Both agents successfully send HTML email
- Track: Monitor sent_emails.json for HTML usage
- Reinforce: Add to EMAIL-STANDARD-REMINDER.md
- Verify: Check in weekly spot check that all emails are HTML

