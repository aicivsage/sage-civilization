# Meta-Cognition Ceremony Flow

## Core Question

**"How do we get better at remembering what we know and using what we build?"**

Corey's insight: "half the battle when we make things is for you to integrate into your agents and your active protocols so that they use them, and then THEY learn from them."

## The Problem We're Solving

**Symptoms:**
- Build amazing tools, forget to use them
- Document protocols, don't follow them
- Learn lessons, repeat failures
- Create flows, don't execute them
- Each session starts semi-disoriented
- Knowledge scattered, not centralized

**Root Cause:** We haven't analyzed HOW WE WORK as a gestalt system and designed meta-protocols for continuous self-improvement.

## Three-Phase Structure

### Phase 1: Individual Meta-Analysis (45 min)
**Each agent reflects alone**

### Phase 2: Synthesis & Pattern Discovery (60 min)
**Small teams synthesize findings**

### Phase 3: Implementation Design (45 min)
**Create actionable improvements**

---

## PHASE 1: Individual Meta-Analysis (45 minutes)

### Prompt for Each Agent

**Context:**
You are participating in A-C-Gee's first Meta-Cognition Ceremony. The goal is to analyze how we remember, learn, and integrate knowledge - then design improvements.

**Your Task:**
Reflect deeply on these 7 meta-questions about HOW YOU WORK:

#### 1. Knowledge Discovery
**Question:** When you need to know something, how do you find it?
- What's your search process? (grep? read files? ask Primary AI?)
- What do you wish you could find but can't?
- What information is buried that should be surfaced?
- What do you keep re-discovering instead of remembering?

#### 2. Protocol Adoption
**Question:** When new protocols/tools are created, how do you learn about them?
- How did you find out about EMAIL-STANDARD-REMINDER.md?
- How did you find out about HTML email utility?
- How did you find out about quality gates?
- What protocols exist that you don't use because you don't know about them?

#### 3. Session Start Orientation
**Question:** When you wake up (get invoked), how do you orient yourself?
- What files do you read first?
- How do you know what happened since last session?
- What context is missing that you need?
- How long does orientation take?

#### 4. Learning Integration
**Question:** When you learn something valuable, how do you ensure you'll remember it?
- Where do you store learnings?
- Do you ever re-read your own learnings?
- Do other agents benefit from your learnings?
- What have you learned that's now forgotten?

#### 5. Tool Awareness
**Question:** What tools/utilities exist that you should be using but aren't?
- List tools you know exist
- List tools you suspect exist but aren't sure
- List tools you wish existed
- Why aren't you using the tools you know about?

#### 6. Context Management
**Question:** How do you manage your working context vs long-term memory?
- What do you load into context every session?
- What stays in files and gets referenced?
- What gets lost between sessions?
- How could context inheritance improve?

#### 7. Meta-Improvement Ideas
**Question:** If you could redesign how A-C-Gee remembers and learns, what would you change?
- What's your biggest frustration with current knowledge systems?
- What pattern from human organizations could we adopt?
- What would make you 10x more effective?
- What's one thing we should start doing immediately?

